<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <title>Gráficos de Cifras</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">Delitos y Reportes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('home') }}">Inicio</a>
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" aria-current="page" >
                        Mapas
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="{{ url_for('map_cifras') }}">Delitos y Reportes en Localidades</a>
                            <a class="dropdown-item" href="{{ url_for('map_policia') }}">Distribución de Presencia Policial</a>
                        </div>
                    </div>
                    <a class="nav-link active" aria-current="page" href="{{ url_for('stats_cifras') }}">Estadísticas</a>
                    <a class="nav-link disabled" aria-disabled="true">Acerca de</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-xl mt-3" style="height: 50vh">
        <canvas id="bar-chart"></canvas>
    </div>

    <script id="chart-data" type="application/json">
        {{ chart_data|tojson }}
    </script>

    <div class="container-xl my-3">
        {{ table|safe }}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', path='chart_graph.js') }}"></script>
</body>
</html>

services:
  nginx:
    image: nginx:alpine-slim
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./.nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app

  backend:
    container_name: backend
    build: ./backend
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app

  frontend:
    container_name: frontend
    build: ./frontend
    expose:
      - "8001"
    restart: unless-stopped
    healthcheck:
      # test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      # interval: 10s
      # timeout: 5s
      # retries: 3
      # start_period: 15s
    networks:
      - app

networks:
  app: